# No Temporal server is needed: workers are built at runtime init and never started, as in many test setups.
quarkus.temporal.connection.target=127.0.0.1:7233
quarkus.temporal.start-workers=false
quarkus.temporal.health.enabled=false
quarkus.temporal.devservices.enabled=false
quarkus.log.level=WARN
quarkus.http.test-port=0
